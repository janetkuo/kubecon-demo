apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gemma-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gemma-server
  template:
    metadata:
      labels:
        app: gemma-server
        ai.gke.io/model: gemma-3-1b-it
        ai.gke.io/inference-server: vllm
        examples.ai.gke.io/source: user-guide
    spec:
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      # Mounts for the driver libraries and binaries from the host
      - name: nvidia-driver-libs
        hostPath:
          path: /home/kubernetes/bin/nvidia/lib64
      - name: nvidia-driver-bin
        hostPath:
          path: /home/kubernetes/bin/nvidia/bin
      # Mounts for the NVIDIA device nodes from the host
      - name: nvidia-devices
        hostPath:
          path: /dev/
      containers:
      - name: inference-server
        image: vllm/vllm-openai:v0.10.0
        # Add privileged security context to access host devices
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "2"
            memory: "10Gi"
            ephemeral-storage: "10Gi"
          limits:
            cpu: "2"
            memory: "10Gi"
            ephemeral-storage: "10Gi"
        # Restore the original vllm command
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        - --model=$(MODEL_ID)
        - --tensor-parallel-size=1
        - --host=0.0.0.0
        - --port=8000
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64
        - name: MODEL_ID
          value: google/gemma-3-1b-it
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: hf_api_token
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        # Mount the driver libraries and binaries
        - name: nvidia-driver-libs
          mountPath: /usr/local/nvidia/lib64
          readOnly: true
        - name: nvidia-driver-bin
          mountPath: /usr/local/nvidia/bin
          readOnly: true
        # Mount the NVIDIA devices
        - name: nvidia-devices
          mountPath: /dev/
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      resourceClaims:
      - name: single-gpu
        resourceClaimTemplateName: gpu-claim-template
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
spec:
  selector:
    app: gemma-server
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
